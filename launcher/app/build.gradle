plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist.
        // Xiaomi: docs/devices/xiaomi-mitv-aetp0-dofus.md (com.ts.launcher).
        // ColorOS TV: docs/devices/oppo-k9-55-oppocnm632.md (com.oneplus.tv.launcher2).
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        // This fork (thangvofastboy/cleanyourtv-vn): 1000 and up, far above upstream's 14, so the in-app update
        // compares against its own releases. Release asset: cleanyourtv-vn-<versionCode>.apk, tag v<versionName>.
        versionCode 1002
        versionName '1.0.2-vn'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    buildFeatures {
        // BuildConfig.VERSION_CODE / VERSION_NAME for the in-app update check (Updates).
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // Test only: the real org.json, since android.jar's copy is a stub on the JVM (ThemeBundle, Updates tests).
    testImplementation 'org.json:json:20240303'
}

// ---- bundled themes (this fork's on-TV theme picker) ----------------------------------------------------------
// Copies the listed folders of ../../themes into the APK's assets at build time, so nothing is duplicated in git:
// config.json, wallpaper.jpg and wallpapers/ (pictures and captions.txt) only, never screenshot.jpg or scripts.
// themes/index.txt lists them as "name<TAB>path" lines in this order; ThemeBundle reads it.
abstract class BundleThemes extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getThemesDir()

    @Input
    abstract ListProperty<String> getNames()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void bundle() {
        File out = getOutputDir().get().asFile
        out.deleteDir()   // not project.delete(): Task.project is not allowed at execution with the configuration cache
        File root = new File(out, 'themes')
        root.mkdirs()
        StringBuilder index = new StringBuilder()
        for (String name : getNames().get()) {
            File src = getThemesDir().get().dir(name).asFile
            if (!new File(src, 'config.json').isFile()) throw new GradleException("themes/$name has no config.json")
            List<String> files = ['config.json']
            if (new File(src, 'wallpaper.jpg').isFile()) files << 'wallpaper.jpg'
            File coll = new File(src, 'wallpapers')
            if (coll.isDirectory()) {
                coll.listFiles().findAll { it.isFile() && !it.name.startsWith('.') && it.name ==~ /[A-Za-z0-9_.-]+\.(?i:jpg|jpeg|png|webp)|captions\.txt/ }
                        .collect { it.name }.sort().each { files << "wallpapers/$it".toString() }
            }
            for (String f : files) {
                File dst = new File(root, "$name/$f")
                dst.parentFile.mkdirs()
                java.nio.file.Files.copy(new File(src, f).toPath(), dst.toPath())
                index.append(name).append('\t').append(f).append('\n')
            }
        }
        new File(root, 'index.txt').setText(index.toString(), 'UTF-8')
    }
}

def bundleThemes = tasks.register('bundleThemes', BundleThemes) {
    themesDir = layout.projectDirectory.dir('../../themes')
    names = ['viet-nam', 'dong-son', 'cinematic', 'glass', 'glass-gallery', 'minimal', 'dock-glass', 'aurora', 'red-rain',
             'ridgelines', 'christmas']
    outputDir = layout.buildDirectory.dir('generated/themeAssets')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(bundleThemes) { it.outputDir }
    }
}
